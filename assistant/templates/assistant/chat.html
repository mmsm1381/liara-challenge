{% extends "assistant/base.html" %}
{% block title %}دستیار لیارا{% endblock %}
{% block content %}
<div class="column chat-column">
  <header class="chat-header">
    <div class="chat-brand">
      <span class="avatar" aria-hidden="true">ل</span>
      <strong>دستیار لیارا</strong>
    </div>
    <div class="chat-tools">
      <button type="button" class="btn-outline" id="reset-btn">شروع دوباره</button>
      <form method="post" action="/logout/" class="inline-form">
        {% csrf_token %}
        <button type="submit" class="link-btn">خروج</button>
      </form>
    </div>
  </header>

  <main id="thread" aria-live="polite">{% for m in messages %}{% include "assistant/_message.html" %}{% endfor %}</main>

  <div class="composer-wrap">
    <div class="composer-error" id="composer-error" role="alert" hidden></div>
    <form class="composer" id="composer" data-max-zip-mb="{{ max_zip_mb|default:50 }}" autocomplete="off">
      <label for="composer-input" class="visually-hidden" id="composer-label">پیام</label>
      <button type="button" class="icon-btn" id="attach-btn" aria-label="پیوست فایل" title="پیوست فایل"{% if not composer.attach %} hidden{% endif %}>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="file-input" accept=".zip" hidden>
      <input type="text" id="composer-input" class="composer-input" placeholder="{{ composer.placeholder|default:'هر سؤالی داری بپرس...' }}" autocomplete="off">
      <button type="submit" class="send-btn" id="send-btn" aria-label="ارسال">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      </button>
    </form>
  </div>
</div>
{{ composer|json_script:"composer-state" }}
{% endblock %}
