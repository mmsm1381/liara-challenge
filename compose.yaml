name: liara-assistant

x-app-env: &app-env
  DATABASE_URL: postgres://assistant:assistant@db:5432/assistant
  REDIS_URL: redis://redis:6379/0
  DJANGO_DEBUG: "1"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  LIARA_FAKE: ${LIARA_FAKE:-0}

x-app-build: &app-build
  build: .
  image: liara-assistant:local
  env_file:
    - path: .env
      required: false
  environment: *app-env
  volumes:
    - appvar:/app/var
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *app-build
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 120
    ports:
      - "8000:8000"

  worker:
    <<: *app-build
    command: ["python", "manage.py", "rqworker", "default"]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

volumes:
  pgdata:
  appvar:
